<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="140" viewBox="0 0 1200 140"
     role="img" aria-labelledby="title desc">
  <title id="title">How it works</title>
  <desc id="desc">The gate intercepts a commit, runs the lint, format, typecheck step chain, and returns a fail-closed verdict.</desc>

  <rect width="1200" height="140" rx="20" fill="#0A0C0F"/>
  <path d="M 1048 0 L 1200 0 L 1200 140 L 1128 140 Z" fill="#3FB950" opacity="0.12"/>

  <text x="56" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="110" font-weight="800" fill="#E6E8EB" opacity="0.08">01</text>
  <text x="132" y="72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="44" font-weight="800" fill="#E6E8EB" letter-spacing="-0.5">How it works</text>
  <text x="132" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8B949E">intercept → step chain → verdict · one hook per commit</text>

  <line x1="56" y1="132" x2="1144" y2="132" stroke="#3FB950" opacity="0.35" stroke-width="1"/>
</svg>
