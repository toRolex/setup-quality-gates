<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="440" viewBox="0 0 1200 440"
     role="img" aria-labelledby="title desc">
  <title id="title">The step chain as a railway crossing — three signal gates, lint and format green, typecheck red and blocking</title>
  <desc id="desc">A commit travels along a track under three signal gates: lint (green, ruff check), format (green, ruff format --check), typecheck (red, ty check). The red gate's barrier arm lies across the track, blocking a commit block. Result: typecheck failed, exit 2, the agent fixes and the chain restarts from lint.</desc>

  <rect width="1200" height="440" rx="24" fill="#0A0C0F"/>

  <text x="56" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#8B949E" letter-spacing="2">THE STEP CHAIN — THREE GATES, ONE VERDICT</text>

  <!-- track -->
  <line x1="56" y1="320" x2="1144" y2="320" stroke="#2A333D" stroke-width="4" stroke-linecap="round"/>
  <path d="M 1120 308 L 1144 320 L 1120 332" fill="none" stroke="#5A6470" stroke-width="2"/>

  <!-- signal posts -->
  <line x1="300" y1="224" x2="300" y2="320" stroke="#1F2730" stroke-width="2"/>
  <line x1="600" y1="224" x2="600" y2="320" stroke="#1F2730" stroke-width="2"/>
  <line x1="900" y1="224" x2="900" y2="320" stroke="#1F2730" stroke-width="2"/>

  <!-- lint signal: green -->
  <circle cx="300" cy="190" r="34" fill="#0F2216" stroke="#3FB950" stroke-width="3"/>
  <circle cx="300" cy="190" r="24" fill="#3FB950"/>
  <path d="M 288 190 L 297 199 L 313 181" fill="none" stroke="#0A0C0F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="300" y="256" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#E6E8EB">lint</text>
  <text x="300" y="280" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8B949E">ruff check .</text>

  <!-- format signal: green -->
  <circle cx="600" cy="190" r="34" fill="#0F2216" stroke="#3FB950" stroke-width="3"/>
  <circle cx="600" cy="190" r="24" fill="#3FB950"/>
  <path d="M 588 190 L 597 199 L 613 181" fill="none" stroke="#0A0C0F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="256" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#E6E8EB">format</text>
  <text x="600" y="280" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8B949E">ruff format --check .</text>

  <!-- typecheck signal: red, barrier down -->
  <circle cx="900" cy="190" r="34" fill="#2A1210" stroke="#FF5A52" stroke-width="3"/>
  <circle cx="900" cy="190" r="24" fill="#FF5A52"/>
  <path d="M 890 180 L 910 200 M 910 180 L 890 200" stroke="#0A0C0F" stroke-width="5" stroke-linecap="round"/>
  <text x="900" y="256" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#E6E8EB">typecheck</text>
  <text x="900" y="280" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8B949E">ty check .</text>

  <!-- barrier arm: down, blocking the track -->
  <rect x="860" y="311" width="150" height="18" rx="9" fill="#FF5A52" stroke="#FFC9C6" stroke-width="1.5"/>
  <circle cx="860" cy="320" r="9" fill="#FF5A52" stroke="#FFC9C6" stroke-width="1.5"/>
  <circle cx="1010" cy="320" r="9" fill="#FF5A52" stroke="#FFC9C6" stroke-width="1.5"/>

  <!-- the blocked commit -->
  <rect x="700" y="288" width="140" height="64" rx="8" fill="#10151A" stroke="#2A333D" stroke-width="1"/>
  <text x="770" y="326" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#E6E8EB">commit #1042</text>

  <!-- verdict -->
  <text x="56" y="404" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#E6E8EB">lint <tspan fill="#3FB950">✓</tspan> · format <tspan fill="#3FB950">✓</tspan> · typecheck <tspan fill="#FF5A52">✗</tspan></text>
  <text x="1144" y="404" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#9DA7B3">any red gate stops the commit · exit 2 · fix → restart from lint</text>
</svg>
